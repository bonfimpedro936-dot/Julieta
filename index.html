<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Julieta App - Controle de Frotas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .status-ok { background-color: #dcfce7; color: #166534; }
        .status-warning { background-color: #fef9c3; color: #854d0e; }
        .status-danger { background-color: #fee2e2; color: #991b1b; }
        .status-empty { background-color: #f3f4f6; color: #6b7280; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen font-sans">
    <div class="max-w-7xl mx-auto p-4">
        <header class="flex justify-between items-center mb-6 bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600 p-2 rounded-lg text-white"><i data-lucide="truck"></i></div>
                <h1 class="text-xl font-bold text-slate-800">Julieta App <span class="text-sm font-normal text-slate-500">| Gestão de Frotas</span></h1>
            </div>
            <div class="flex gap-2">
                <button onclick="exportData()" class="flex items-center gap-2 px-3 py-2 text-sm font-medium text-slate-600 bg-slate-200 rounded-lg hover:bg-slate-300 transition"><i data-lucide="download" class="w-4 h-4"></i> Backup</button>
                <button onclick="clearAllData()" class="flex items-center gap-2 px-3 py-2 text-sm font-medium text-red-600 bg-red-50 rounded-lg hover:bg-red-100 transition"><i data-lucide="trash-2" class="w-4 h-4"></i> Limpar</button>
            </div>
        </header>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <div class="md:col-span-2 relative">
                <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 w-5 h-5"></i>
                <input type="text" id="searchInput" oninput="renderTable()" placeholder="Buscar veículo ou placa..." class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none shadow-sm">
            </div>
            <button onclick="openModal()" class="bg-blue-600 text-white px-6 py-3 rounded-xl font-bold hover:bg-blue-700 transition flex items-center justify-center gap-2 shadow-md">
                <i data-lucide="plus-circle" class="w-5 h-5"></i> Novo Veículo
            </button>
        </div>
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-slate-50 border-b border-slate-200">
                        <tr>
                            <th class="p-4 text-sm font-semibold text-slate-600">Veículo/Placa</th>
                            <th class="p-4 text-sm font-semibold text-slate-600">Status</th>
                            <th class="p-4 text-sm font-semibold text-slate-600">Última Revisão</th>
                            <th class="p-4 text-sm font-semibold text-slate-600 text-right">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-slate-100"></tbody>
                </table>
            </div>
        </div>
    </div>
    <div id="modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50 backdrop-blur-sm">
        <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl overflow-hidden">
            <div class="p-6 border-b border-slate-100 flex justify-between items-center">
                <h3 id="modalTitle" class="text-lg font-bold text-slate-800">Novo Veículo</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x"></i></button>
            </div>
            <form id="vehicleForm" class="p-6 space-y-4">
                <input type="hidden" id="editIndex">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Identificação (Placa/Nome)</label>
                    <input type="text" id="vehicleName" required class="w-full p-3 rounded-lg border border-slate-200 outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Data da Revisão</label>
                    <input type="date" id="revisionDate" required class="w-full p-3 rounded-lg border border-slate-200 outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Status</label>
                    <select id="status" class="w-full p-3 rounded-lg border border-slate-200 outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="ok">✅ Em Dia</option>
                        <option value="warning">⚠️ Atenção</option>
                        <option value="danger">❌ Atrasado</option>
                    </select>
                </div>
                <div class="pt-4 flex gap-3">
                    <button type="button" onclick="closeModal()" class="flex-1 px-4 py-3 text-slate-600 font-medium hover:bg-slate-100 rounded-lg transition">Cancelar</button>
                    <button type="submit" class="flex-1 px-4 py-3 bg-blue-600 text-white font-bold rounded-lg hover:bg-blue-700 transition">Salvar</button>
                </div>
            </form>
        </div>
    </div>
    <script>
        let vehicles = JSON.parse(localStorage.getItem('julieta_data')) || [];
        function saveToStorage() {
            localStorage.setItem('julieta_data', JSON.stringify(vehicles));
            renderTable();
        }
        function openModal(index = null) {
            const modal = document.getElementById('modal');
            modal.classList.replace('hidden', 'flex');
            if (index !== null) {
                document.getElementById('modalTitle').innerText = "Editar Veículo";
                document.getElementById('editIndex').value = index;
                document.getElementById('vehicleName').value = vehicles[index].name;
                document.getElementById('revisionDate').value = vehicles[index].date;
                document.getElementById('status').value = vehicles[index].status;
            } else {
                document.getElementById('modalTitle').innerText = "Novo Veículo";
                document.getElementById('vehicleForm').reset();
                document.getElementById('editIndex').value = "";
            }
        }
        function closeModal() {
            document.getElementById('modal').classList.replace('flex', 'hidden');
        }
        document.getElementById('vehicleForm').onsubmit = (e) => {
            e.preventDefault();
            const index = document.getElementById('editIndex').value;
            const data = {
                name: document.getElementById('vehicleName').value,
                date: document.getElementById('revisionDate').value,
                status: document.getElementById('status').value
            };
            if (index === "") vehicles.push(data); else vehicles[index] = data;
            saveToStorage();
            closeModal();
        };
        function deleteVehicle(index) {
            if(confirm("Excluir este veículo?")) { vehicles.splice(index, 1); saveToStorage(); }
        }
        function renderTable() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = "";
            vehicles.forEach((v, index) => {
                if (v.name.toLowerCase().includes(search)) {
                    tbody.innerHTML += `<tr class="hover:bg-slate-50 transition"><td class="p-4 font-medium text-slate-800">${v.name}</td><td class="p-4"><span class="px-3 py-1 rounded-full text-xs font-bold status-${v.status}">${v.status.toUpperCase()}</span></td><td class="p-4 text-slate-600 text-sm">${v.date.split('-').reverse().join('/')}</td><td class="p-4 text-right flex justify-end gap-2"><button onclick="openModal(${index})" class="p-2 text-blue-600 hover:bg-blue-50 rounded-lg transition"><i data-lucide="edit-3" class="w-4 h-4"></i></button><button onclick="deleteVehicle(${index})" class="p-2 text-red-600 hover:bg-red-50 rounded-lg transition"><i data-lucide="trash" class="w-4 h-4"></i></button></td></tr>`;
                }
            });
            lucide.createIcons();
        }
        function exportData() {
            const blob = new Blob([JSON.stringify(vehicles)], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'julieta_backup.json'; a.click();
        }
        function clearAllData() {
            if(confirm("Apagar tudo?")) { vehicles = []; saveToStorage(); }
        }
        window.onload = () => { renderTable(); lucide.createIcons(); };
    </script>
</body>
</html>
