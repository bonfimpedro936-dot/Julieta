<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Julieta App - Controle de Frotas</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        .status-ok { background-color: #dcfce7; color: #166534; }
        .status-warning { background-color: #fef9c3; color: #854d0e; }
        .status-danger { background-color: #fee2e2; color: #991b1b; }

        body {
            -webkit-tap-highlight-color: transparent;
        }

        @media (max-width: 640px) {
            .desktop-table {
                display: none;
            }

            .mobile-card {
                display: block;
            }

            header h1 {
                font-size: 18px;
            }

            header span {
                display: none;
            }
        }

        @media (min-width: 641px) {
            .mobile-card {
                display: none;
            }

            .desktop-table {
                display: block;
            }
        }
    </style>
</head>

<body class="bg-slate-100 min-h-screen font-sans">

<div class="max-w-7xl mx-auto p-3 sm:p-4">

    <!-- CABEÇALHO -->
    <header class="flex justify-between items-center mb-5 bg-white p-3 sm:p-4 rounded-2xl shadow-sm border border-slate-200">

        <div class="flex items-center gap-3 min-w-0">
            <div class="bg-blue-600 p-2 rounded-lg text-white shrink-0">
                <i data-lucide="truck"></i>
            </div>

            <h1 class="text-lg sm:text-xl font-bold text-slate-800 truncate">
                Julieta App
                <span class="text-sm font-normal text-slate-500">
                    | Gestão de Frotas
                </span>
            </h1>
        </div>

        <div class="flex gap-2 shrink-0">
            <button onclick="exportData()"
                class="flex items-center gap-2 px-3 py-2 text-sm font-medium text-slate-600 bg-slate-200 rounded-lg hover:bg-slate-300 transition">
                <i data-lucide="download" class="w-4 h-4"></i>
                <span class="hidden sm:inline">Backup</span>
            </button>

            <button onclick="clearAllData()"
                class="flex items-center gap-2 px-3 py-2 text-sm font-medium text-red-600 bg-red-50 rounded-lg hover:bg-red-100 transition">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
                <span class="hidden sm:inline">Limpar</span>
            </button>
        </div>

    </header>


    <!-- PESQUISA + NOVO -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-5">

        <div class="md:col-span-2 relative">
            <i data-lucide="search"
                class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 w-5 h-5"></i>

            <input
                type="text"
                id="searchInput"
                oninput="renderTable()"
                placeholder="Buscar Julieta ou código..."
                class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none shadow-sm">
        </div>

        <button onclick="openModal()"
            class="bg-blue-600 text-white px-6 py-3 rounded-xl font-bold hover:bg-blue-700 transition flex items-center justify-center gap-2 shadow-md">
            <i data-lucide="plus-circle" class="w-5 h-5"></i>
            Nova Julieta
        </button>

    </div>


    <!-- CONTADOR -->
    <div class="mb-3 text-sm text-slate-500 px-1">
        Total de Julietas: <strong id="totalVehicles">0</strong>
    </div>


    <!-- TABELA DESKTOP -->
    <div class="desktop-table bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">

        <div class="overflow-x-auto">

            <table class="w-full text-left border-collapse">

                <thead class="bg-slate-50 border-b border-slate-200">

                    <tr>
                        <th class="p-4 text-sm font-semibold text-slate-600">
                            Julieta / Código
                        </th>

                        <th class="p-4 text-sm font-semibold text-slate-600">
                            Status
                        </th>

                        <th class="p-4 text-sm font-semibold text-slate-600">
                            Data que passou
                        </th>

                        <th class="p-4 text-sm font-semibold text-slate-600 text-right">
                            Ações
                        </th>
                    </tr>

                </thead>

                <tbody id="tableBody"
                    class="divide-y divide-slate-100">
                </tbody>

            </table>

        </div>

    </div>


    <!-- CARDS CELULAR -->
    <div id="mobileBody" class="mobile-card space-y-3"></div>


</div>


<!-- MODAL -->
<div id="modal"
    class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50 backdrop-blur-sm">

    <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl overflow-hidden">

        <div class="p-5 border-b border-slate-100 flex justify-between items-center">

            <h3 id="modalTitle"
                class="text-lg font-bold text-slate-800">
                Nova Julieta
            </h3>

            <button onclick="closeModal()"
                class="text-slate-400 hover:text-slate-600">
                <i data-lucide="x"></i>
            </button>

        </div>


        <form id="vehicleForm" class="p-5 space-y-4">

            <input type="hidden" id="editIndex">


            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">
                    Código / Identificação
                </label>

                <input
                    type="text"
                    id="vehicleName"
                    required
                    class="w-full p-3 rounded-lg border border-slate-200 outline-none focus:ring-2 focus:ring-blue-500">
            </div>


            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">
                    Data que passou
                </label>

                <input
                    type="date"
                    id="revisionDate"
                    required
                    class="w-full p-3 rounded-lg border border-slate-200 outline-none focus:ring-2 focus:ring-blue-500">
            </div>


            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">
                    Status
                </label>

                <select
                    id="status"
                    class="w-full p-3 rounded-lg border border-slate-200 outline-none focus:ring-2 focus:ring-blue-500">

                    <option value="ok">
                        ✅ Em Dia
                    </option>

                    <option value="warning">
                        ⚠️ Atenção
                    </option>

                    <option value="danger">
                        ❌ Atrasado
                    </option>

                </select>

            </div>


            <div class="pt-3 flex gap-3">

                <button
                    type="button"
                    onclick="closeModal()"
                    class="flex-1 px-4 py-3 text-slate-600 font-medium hover:bg-slate-100 rounded-lg transition">
                    Cancelar
                </button>

                <button
                    type="submit"
                    class="flex-1 px-4 py-3 bg-blue-600 text-white font-bold rounded-lg hover:bg-blue-700 transition">
                    Salvar
                </button>

            </div>

        </form>

    </div>

</div>


<script>

/* =========================================================
   55 JULIETAS + DATAS DO ARQUIVO
   ========================================================= */

const dadosJulietas = [

    ["230001", "2026-07-01"],
    ["230002", "2026-08-27"],
    ["230003", "2026-08-03"],
    ["230004", "2026-08-25"],
    ["230005", "2026-08-27"],
    ["230006", "2026-08-30"],
    ["230007", "2026-07-18"],
    ["230008", "2026-07-12"],
    ["230009", "2026-08-14"],
    ["230010", "2026-07-16"],
    ["230011", "2026-08-02"],
    ["230012", "2026-07-08"],
    ["230013", "2026-07-25"],
    ["230014", "2026-07-22"],
    ["230015", "2026-08-23"],
    ["230016", "2026-07-02"],
    ["230017", "2026-08-18"],
    ["230018", "2026-08-11"],
    ["230019", "2026-07-12"],
    ["230020", "2026-08-27"],
    ["230021", "2026-08-27"],
    ["230022", "2026-08-30"],
    ["230023", "2026-08-24"],
    ["230024", "2026-05-24"],
    ["230025", "2026-08-08"],
    ["230026", "2026-08-21"],
    ["230027", "2026-08-14"],
    ["230028", "2026-08-18"],
    ["230029", "2026-08-14"],
    ["230030", "2026-08-21"],

    ["230031", "2026-07-31"],
    ["230032", "2026-08-02"],
    ["230033", "2026-09-04"],
    ["230034", "2026-08-18"],
    ["230035", "2026-07-27"],
    ["230036", "2026-07-21"],
    ["230037", "2026-07-04"],
    ["230038", "2026-08-28"],
    ["230039", "2026-08-11"],
    ["230040", "2026-08-02"],
    ["230041", "2026-08-11"],
    ["230042", "2026-06-15"],
    ["230043", "2026-08-21"],
    ["230044", "2026-07-27"],
    ["230045", "2026-08-21"],
    ["230046", "2026-05-11"],
    ["230047", "2026-08-22"],
    ["230048", "2026-08-29"],
    ["230049", "2026-07-31"],
    ["230050", "2026-07-21"],
    ["230051", "2026-07-31"],
    ["230052", "2026-05-19"],
    ["230053", "2026-05-29"],
    ["230054", "2026-07-03"],
    ["230055", "2026-08-27"]

];


/* =========================================================
   CARREGA OS DADOS
   ========================================================= */

let vehicles = JSON.parse(
    localStorage.getItem("julieta_data")
);


/*
   Se ainda não existir banco salvo,
   coloca automaticamente as 55 Julietas.
*/

if (!vehicles || !Array.isArray(vehicles) || vehicles.length === 0) {

    vehicles = dadosJulietas.map(item => ({
        name: item[0],
        date: item[1],
        status: "ok"
    }));

    localStorage.setItem(
        "julieta_data",
        JSON.stringify(vehicles)
    );
}


/* =========================================================
   SALVAR
   ========================================================= */

function saveToStorage() {

    localStorage.setItem(
        "julieta_data",
        JSON.stringify(vehicles)
    );

    renderTable();
}


/* =========================================================
   ABRIR MODAL
   ========================================================= */

function openModal(index = null) {

    const modal = document.getElementById("modal");

    modal.classList.replace("hidden", "flex");


    if (index !== null) {

        document.getElementById("modalTitle").innerText =
            "Editar Julieta";

        document.getElementById("editIndex").value =
            index;

        document.getElementById("vehicleName").value =
            vehicles[index].name;

        document.getElementById("revisionDate").value =
            vehicles[index].date;

        document.getElementById("status").value =
            vehicles[index].status;

    } else {

        document.getElementById("modalTitle").innerText =
            "Nova Julieta";

        document.getElementById("vehicleForm").reset();

        document.getElementById("editIndex").value =
            "";

    }

}


/* =========================================================
   FECHAR MODAL
   ========================================================= */

function closeModal() {

    document
        .getElementById("modal")
        .classList
        .replace("flex", "hidden");

}


/* =========================================================
   SALVAR FORMULÁRIO
   ========================================================= */

document.getElementById("vehicleForm").onsubmit = (e) => {

    e.preventDefault();


    const index =
        document.getElementById("editIndex").value;


    const data = {

        name:
            document.getElementById("vehicleName").value.trim(),

        date:
            document.getElementById("revisionDate").value,

        status:
            document.getElementById("status").value

    };


    if (index === "") {

        vehicles.push(data);

    } else {

        vehicles[index] = data;

    }


    saveToStorage();

    closeModal();

};


/* =========================================================
   EXCLUIR
   ========================================================= */

function deleteVehicle(index) {

    if (confirm("Excluir esta Julieta?")) {

        vehicles.splice(index, 1);

        saveToStorage();

    }

}


/* =========================================================
   FORMATAR DATA
   ========================================================= */

function formatDate(date) {

    if (!date) return "-";

    const parts = date.split("-");

    if (parts.length !== 3) return date;

    return `${parts[2]}/${parts[1]}/${parts[0]}`;

}


/* =========================================================
   STATUS
   ========================================================= */

function statusText(status) {

    if (status === "warning") return "ATENÇÃO";

    if (status === "danger") return "ATRASADO";

    return "EM DIA";

}


/* =========================================================
   RENDERIZAR
   ========================================================= */

function renderTable() {

    const search =
        document
            .getElementById("searchInput")
            .value
            .toLowerCase()
            .trim();


    const tbody =
        document.getElementById("tableBody");

    const mobileBody =
        document.getElementById("mobileBody");


    tbody.innerHTML = "";

    mobileBody.innerHTML = "";


    let quantidade = 0;


    vehicles.forEach((v, index) => {

        const nome =
            String(v.name || "").toLowerCase();


        if (!nome.includes(search)) {
            return;
        }


        quantidade++;


        /* DESKTOP */

        tbody.innerHTML += `

            <tr class="hover:bg-slate-50 transition">

                <td class="p-4 font-bold text-slate-800">
                    ${v.name}
                </td>


                <td class="p-4">

                    <span
                        class="px-3 py-1 rounded-full text-xs font-bold status-${v.status}">
                        ${statusText(v.status)}
                    </span>

                </td>


                <td class="p-4 text-slate-600 text-sm font-medium">

                    ${formatDate(v.date)}

                </td>


                <td class="p-4 text-right">

                    <div class="flex justify-end gap-2">

                        <button
                            onclick="openModal(${index})"
                            class="p-2 text-blue-600 hover:bg-blue-50 rounded-lg transition">

                            <i data-lucide="edit-3"
                               class="w-4 h-4"></i>

                        </button>


                        <button
                            onclick="deleteVehicle(${index})"
                            class="p-2 text-red-600 hover:bg-red-50 rounded-lg transition">

                            <i data-lucide="trash"
                               class="w-4 h-4"></i>

                        </button>

                    </div>

                </td>

            </tr>

        `;


        /* CELULAR */

        mobileBody.innerHTML += `

            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4">

                <div class="flex justify-between items-start gap-3">

                    <div>

                        <div class="text-xs text-slate-400 font-medium mb-1">
                            JULIETA
                        </div>

                        <div class="text-lg font-bold text-slate-800">
                            ${v.name}
                        </div>

                    </div>


                    <span
                        class="px-3 py-1 rounded-full text-xs font-bold whitespace-nowrap status-${v.status}">
                        ${statusText(v.status)}
                    </span>

                </div>


                <div class="mt-4 pt-3 border-t border-slate-100 flex justify-between items-center">

                    <div>

                        <div class="text-xs text-slate-400">
                            DATA QUE PASSOU
                        </div>

                        <div class="font-semibold text-slate-700">
                            ${formatDate(v.date)}
                        </div>

                    </div>


                    <div class="flex gap-2">

                        <button
                            onclick="openModal(${index})"
                            class="p-2.5 text-blue-600 bg-blue-50 rounded-xl">

                            <i data-lucide="edit-3"
                               class="w-5 h-5"></i>

                        </button>


                        <button
                            onclick="deleteVehicle(${index})"
                            class="p-2.5 text-red-600 bg-red-50 rounded-xl">

                            <i data-lucide="trash"
                               class="w-5 h-5"></i>

                        </button>

                    </div>

                </div>

            </div>

        `;

    });


    document.getElementById("totalVehicles").innerText =
        quantidade;


    lucide.createIcons();

}


/* =========================================================
   BACKUP
   ========================================================= */

function exportData() {

    const blob = new Blob(
        [JSON.stringify(vehicles, null, 2)],
        { type: "application/json" }
    );


    const url =
        URL.createObjectURL(blob);


    const a =
        document.createElement("a");


    a.href = url;

    a.download =
        "julieta_backup.json";


    document.body.appendChild(a);

    a.click();

    document.body.removeChild(a);

    URL.revokeObjectURL(url);

}


/* =========================================================
   LIMPAR
   ========================================================= */

function clearAllData() {

    if (confirm("Apagar todas as Julietas?")) {

        vehicles = [];

        saveToStorage();

    }

}


/* =========================================================
   INICIAR
   ========================================================= */

window.onload = () => {

    renderTable();

    lucide.createIcons();

};

</script>

</body>
</html>
