/* =========================================================

   ========================================================= */

const dadosIniciais = dadosJulietas.map(item => ({

/* =========================================================
   LOGIN COM GOOGLE
   ========================================================= */

const googleProvider =
    new firebase.auth.GoogleAuthProvider();

let appIniciado = false;


function entrarComGoogle() {

    auth.signInWithRedirect(googleProvider)

    .catch(erro => {

        console.error(erro);

        alert(
            "Não foi possível entrar com o Google. " +
            erro.message
        );

}


/* =========================================================
   CARREGAR DADOS (somente depois do login)
   ========================================================= */

async function iniciarApp() {

    if (appIniciado) {

        return;

    }

    appIniciado = true;

    try {

        const snapshot =
            await dadosRef.once("value");


        /*
         Se já existem dados no Firebase,
         NÃO substitui pelos dados iniciais.
        */

        if (snapshot.exists()) {

            const dados = snapshot.val();

            if (Array.isArray(dados)) {

                vehicles = dados;

            } else {

                vehicles = Object.values(dados || {});

            }

        }

        /*
         Firebase vazio:
         primeiro tenta recuperar localStorage.
         Se não existir, usa as 55 Julietas.
        */

        else {

            let antigos = null;

            try {

                antigos =
                    JSON.parse(
                        localStorage.getItem("julieta_data")
                    );

            } catch (erro) {

                antigos = null;

            }


            if (
                Array.isArray(antigos) &&
                antigos.length > 0
            ) {

                vehicles = antigos;

            } else {

                vehicles = dadosIniciais;

            }


            await dadosRef.set(vehicles);

        }


        firebasePronto = true;


        localStorage.setItem(
            "julieta_data",
            JSON.stringify(vehicles)
        );


        renderTable();


        /*
         SINCRONIZAÇÃO EM TEMPO REAL
        */

        dadosRef.on("value", snapshot => {

            const dados = snapshot.val();


            if (Array.isArray(dados)) {

                vehicles = dados;

            } else if (
                dados &&
                typeof dados === "object"
            ) {

                vehicles = Object.values(dados);

            } else {

                vehicles = [];

            }


            localStorage.setItem(
                "julieta_data",
                JSON.stringify(vehicles)
            );


            renderTable();

        });


    } catch (erro) {

        appIniciado = false;

        console.error(erro);

        alert(
            "Erro ao carregar os dados do Firebase."
        );

    }

}

/* =========================================================
   FORMATAR DATA
   ========================================================= */

function formatDate(date) {

    if (!date) {

        return "-";

    }


    const parts =
        date.split("-");


    if (
        parts.length !== 3
    ) {

        return date;

    }


    return `${parts[2]}/${parts[1]}/${parts[0]}`;

}


/* =========================================================
   DIAS PASSADOS
   ========================================================= */

function getDaysPassed(date) {

    if (!date) {

        return null;

    }


    const partes =
        date.split("-");


    if (
        partes.length !== 3
    ) {

        return null;

    }


    const dataPassou =
        new Date(
            Number(partes[0]),
            Number(partes[1]) - 1,
            Number(partes[2])
        );


    dataPassou.setHours(
        0,
        0,
        0,
        0
    );


    const hoje =
        new Date();


    hoje.setHours(
        0,
        0,
        0,
        0
    );


    return Math.floor(
        (
            hoje - dataPassou
        ) /
        86400000
    );

}


/* =========================================================
   STATUS AUTOMÁTICO

   0 - 7 dias  = EM DIA
   8 - 10 dias = ATENÇÃO
   11+ dias    = ATRASADA
   ========================================================= */

function getStatusAutomatico(date) {

    const dias =
        getDaysPassed(date);


    if (dias === null) {

        return "ok";

    }


    if (dias > 10) {

        return "danger";

    }


    if (dias >= 8) {

        return "warning";

    }


    return "ok";

}


/* =========================================================
   TEXTO DO STATUS
   ========================================================= */

function statusText(status) {

    if (
        status === "warning"
    ) {

        return "ATENÇÃO";

    }


    if (
        status === "danger"
    ) {

        return "ATRASADO";

    }


    return "EM DIA";

}

/* =========================================================

   ========================================================= */

function escapeHtml(text) {

    return String(
        text ?? ""
    ).replace(
        /[&<>"']/g,
        function(m) {

            return {

                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"

            }[m];

        }
    );

}

/* =========================================================
   BACKUP
   ========================================================= */

function exportData() {

    const blob =
        new Blob(
            [
                JSON.stringify(
                    vehicles,
                    null,
                    2
                )
            ],
            {
                type:
                    "application/json"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const a =
        document.createElement(
            "a"
        );


    a.href = url;

    a.download =
        "julieta_backup.json";


    document.body.appendChild(a);

    a.click();

    a.remove();

    URL.revokeObjectURL(url);

}
