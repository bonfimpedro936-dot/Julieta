<!DOCTYPE html><html lang="pt-br">
<head>

<style>

</div>

/* =========================================================
   CARREGAR DADOS
   ========================================================= */

let vehicles = JSON.parse(
    localStorage.getItem("julieta_data")
);

if (
    !vehicles ||
    !Array.isArray(vehicles) ||
    vehicles.length === 0 ||
    !vehicles[0].column
) {

    vehicles = dadosJulietas.map(item => ({

        column: item[0],

        name: item[1],

        date: item[2],

        status: "ok"

    }));

    localStorage.setItem(
        "julieta_data",
        JSON.stringify(vehicles)
    );
}


/* =========================================================
   SALVAR
   ========================================================= */

function saveToStorage() {

    localStorage.setItem(
        "julieta_data",
        JSON.stringify(vehicles)
    );

    renderTable();
}


/* =========================================================
   ABRIR MODAL
   ========================================================= */

function openModal(index = null) {

    const modal =
        document.getElementById("modal");

    modal.classList.replace(
        "hidden",
        "flex"
    );


    if (index !== null) {

        document.getElementById(
            "modalTitle"
        ).innerText =
            "Editar Julieta";


        document.getElementById(
            "editIndex"
        ).value = index;


        document.getElementById(
            "columnNumber"
        ).value =
            vehicles[index].column;


        document.getElementById(
            "vehicleName"
        ).value =
            vehicles[index].name;


        document.getElementById(
            "revisionDate"
        ).value =
            vehicles[index].date;


        document.getElementById(
            "status"
        ).value =
            vehicles[index].status;

    } else {

        document.getElementById(
            "modalTitle"
        ).innerText =
            "Nova Julieta";


        document.getElementById(
            "vehicleForm"
        ).reset();


        document.getElementById(
            "editIndex"
        ).value = "";

    }
}


/* =========================================================
   FECHAR MODAL
   ========================================================= */

function closeModal() {

    document
        .getElementById("modal")
        .classList
        .replace(
            "flex",
            "hidden"
        );

}


/* =========================================================
   SALVAR FORMULÁRIO
   ========================================================= */

document.getElementById(
    "vehicleForm"
).onsubmit = (e) => {

    e.preventDefault();


    const index =
        document.getElementById(
            "editIndex"
        ).value;


    const data = {

        column:
            Number(
                document.getElementById(
                    "columnNumber"
                ).value
            ),

        name:
            document.getElementById(
                "vehicleName"
            ).value.trim(),

        date:
            document.getElementById(
                "revisionDate"
            ).value,

        status:
            document.getElementById(
                "status"
            ).value

    };


    if (index === "") {

        vehicles.push(data);

    } else {

        vehicles[index] = data;

    }


    saveToStorage();

    closeModal();

};


/* =========================================================
   EXCLUIR
   ========================================================= */

function deleteVehicle(index) {

    if (
        confirm(
            "Excluir esta Julieta?"
        )
    ) {

        vehicles.splice(
            index,
            1
        );

        saveToStorage();

    }

}


/* =========================================================
   FORMATAR DATA
   ========================================================= */

function formatDate(date) {

    if (!date)
        return "-";


    const parts =
        date.split("-");


    if (
        parts.length !== 3
    )
        return date;


    return `${parts[2]}/${parts[1]}/${parts[0]}`;

}


/* =========================================================
   NOVO: CALCULAR DIAS E STATUS AUTOMATICAMENTE
   ========================================================= */

function getDaysPassed(date) {

    if (!date) {
        return null;
    }

    const partes = date.split("-");

    if (partes.length !== 3) {
        return null;
    }

    const dataPassou = new Date(
        Number(partes[0]),
        Number(partes[1]) - 1,
        Number(partes[2])
    );

    dataPassou.setHours(0, 0, 0, 0);

    const hoje = new Date();

    hoje.setHours(0, 0, 0, 0);

    const diferenca = Math.floor(
        (hoje - dataPassou) /
        (1000 * 60 * 60 * 24)
    );

    return diferenca;
}


function getStatusAutomatico(date) {

    const dias = getDaysPassed(date);

    /*
       Sem data = não marcar como atraso.
    */
    if (dias === null) {
        return "ok";
    }

    /*
       Mais de 10 dias = ATRASADO.
    */
    if (dias > 10) {
        return "danger";
    }

    /*
       De 8 até 10 dias = ATENÇÃO.
    */
    if (dias >= 8) {
        return "warning";
    }

    /*
       Até 7 dias = EM DIA.
    */
    return "ok";
}


function statusText(status) {

    if (
        status === "warning"
    )
        return "ATENÇÃO";


    if (
        status === "danger"
    )
        return "ATRASADO";


    return "EM DIA";

}


/* =========================================================
   RENDERIZAR
   ========================================================= */

function renderTable() {

        document
            .getElementById(
                "searchInput"
            )
            .value
            .toLowerCase()
            .trim();


    const tbody =
        document.getElementById(
            "tableBody"
        );

        document.getElementById(
            "mobileBody"
        );


    tbody.innerHTML = "";

    mobileBody.innerHTML = "";


    let quantidade = 0;

            const texto =
                String(
                    v.name || ""
                ).toLowerCase();


            const coluna =
                String(
                    v.column || ""
                );

                !texto.includes(search) &&
                !coluna.includes(search)
            ) {
                return;
            }


            quantidade++;


            /*
               IMPORTANTE:
               O status exibido agora é calculado
               pela DATA, e não pelo status salvo.
            */

            const statusAtual =
                getStatusAutomatico(v.date);

}


/* =========================================================
   BACKUP
   ========================================================= */

function exportData() {

    const blob =
        new Blob(
            [
                JSON.stringify(
                    vehicles,
                    null,
                    2
                )
            ],
            {
                type:
                    "application/json"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const a =
        document.createElement(
            "a"
        );


    a.href = url;


    a.download =
        "julieta_backup.json";


    document.body.appendChild(a);

    a.click();

    document.body.removeChild(a);

    URL.revokeObjectURL(url);

}


/* =========================================================
   LIMPAR
   ========================================================= */

function clearAllData() {

    if (
        confirm(
            "Apagar todas as Julietas?"
        )
    ) {

        vehicles = [];

        saveToStorage();

    }

}


/* =========================================================
   INICIAR
   ========================================================= */

window.onload = () => {

    renderTable();

    lucide.createIcons();

};

</script></body>
