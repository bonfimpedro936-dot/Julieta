<title>Julieta App</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
.card-vencido { background-color: #fef2f2; border-color: #fecaca; }
.card-emdia { background-color: #f0fdf4; border-color: #bbf7d0; }
.modal-overlay { background-color: rgba(0,0,0,0.6); backdrop-filter: blur(8px); }
html, body { overflow-x: hidden; position: fixed; width: 100%; height: 100%; overflow-y: auto; }
</style>

<body class="bg-slate-50 text-slate-900 pb-10">

<header class="bg-slate-900 text-white p-5 shadow-lg sticky top-0 z-10 rounded-b-3xl">
<div class="max-w-5xl mx-auto flex items-center justify-between">
<div class="flex items-center gap-3">
<div class="bg-blue-500 p-2 rounded-lg">
<i data-lucide="refresh-cw" class="text-white" style="width:20px"></i>
</div>
<div>
<h1 class="text-lg font-bold leading-tight">JULIETA APP</h1>
<p class="text-slate-400 text-[10px] uppercase tracking-widest">Gestão de Preventivas</p>
</div>
</div>
<div id="stats-header" class="flex gap-2 text-[10px] font-bold uppercase"></div>
</div>
</header>

<main class="max-w-5xl mx-auto p-4 space-y-4">
<div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
<div class="relative">
<i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" style="width:18px"></i>
<input type="text" id="searchInput" placeholder="Buscar coluna ou frota..." class="w-full pl-10 pr-4 py-3 bg-white border border-slate-200 focus:ring-2 focus:ring-blue-500 rounded-2xl transition-all outline-none shadow-sm text-sm" />
</div>
<div class="relative">
<i data-lucide="filter" class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" style="width:18px"></i>
<select id="filterStatus" class="w-full pl-10 pr-4 py-3 bg-white border border-slate-200 focus:ring-2 focus:ring-blue-500 rounded-2xl transition-all outline-none shadow-sm text-sm appearance-none cursor-pointer">
<option value="all">Todos os Status</option>
<option value="emdia">Apenas Em Dia</option>
<option value="vencida">Apenas Vencidas</option>
</select>
</div>
</div>
<div id="julietaGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3"></div>
</main>

<div id="updateModal" class="fixed inset-0 modal-overlay hidden z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 transition-opacity duration-300">
<div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl shadow-2xl overflow-hidden animate-in slide-in-from-bottom duration-300">
<div class="p-6 border-b border-slate-100 flex justify-between items-center">
<div>
<h3 class="text-xl font-bold text-slate-800">Atualizar Coluna</h3>
<p class="text-blue-600 font-bold text-2xl" id="modalColId"></p>
</div>
<button onclick="closeModal()" class="p-2 bg-slate-100 rounded-full text-slate-400 hover:text-slate-600">
<i data-lucide="x" style="width:20px"></i>
</button>
</div>
<div class="p-6 space-y-6">
<div>
<label class="block text-xs font-bold text-slate-400 uppercase mb-2">Data da Revisão</label>
<input type="date" id="newDateInput" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none text-lg font-semibold" />
</div>
<button onclick="saveDate()" class="w-full py-4 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-2xl transition-all active:scale-95 flex items-center justify-center gap-2 shadow-lg shadow-blue-200">
<i data-lucide="check" style="width:20px"></i> Confirmar Data
</button>
</div>
</div>
</div>
