Código / Identificação

<input type="text" id="vehicleName" required
class="w-full p-3 rounded-lg border outline-none">
</div>

<div>
<label class="block text-sm font-medium mb-1">
Data que passou
</label>

<input type="date" id="revisionDate"
class="w-full p-3 rounded-lg border outline-none">
</div>

<div>
<label class="block text-sm font-medium mb-1">
Status
</label>

<select id="status"
class="w-full p-3 rounded-lg border outline-none">

<option value="warning">⚠️ Atenção</option>

</select>
</div>

<div class="pt-3 flex gap-3">

<button type="button" onclick="closeModal()"
class="flex-1 px-4 py-3 text-slate-600 rounded-lg">
Cancelar
</button>

<button type="submit"
class="flex-1 px-4 py-3 bg-blue-600 text-white font-bold rounded-lg">
Salvar
</button>

</div>

</form>
</div>

/* =========================================================
   DADOS
========================================================= */

let vehicles = [];
let statusFilter = "all";


const dadosIniciais = dadosJulietas.map(x => ({
    column:x[0],
    name:x[1],
    date:x[2],
    status:"ok"
}));


/* =========================================================
   LOGIN ANÔNIMO + SINCRONIZAÇÃO
========================================================= */

auth.signInAnonymously()
.then(() => {

    return dadosRef.once("value");

})
.then(snapshot => {

    if(!snapshot.exists()){

        return dadosRef.set(dadosIniciais);

    }

})
.then(() => {

    dadosRef.on("value", snapshot => {

        const dados = snapshot.val();

        if(Array.isArray(dados)){
            vehicles = dados;
        }
        else if(dados){
            vehicles = Object.values(dados);
        }
        else{
            vehicles = [];
        }

        renderTable();

    });

})
.catch(error => {

    console.error(error);

    alert(
        "Erro ao conectar ao banco Firebase. Verifique sua internet e as regras."
    );

});


/* =========================================================
   SALVAR NO FIREBASE
========================================================= */

function saveToStorage(){

    dadosRef.set(vehicles)
    .then(() => {
        renderTable();
    })
    .catch(error => {

        console.error(error);

        alert("Erro ao salvar os dados.");

    });

}


/* =========================================================
   MODAL
========================================================= */

function openModal(index=null){

    const modal=document.getElementById("modal");

    modal.classList.remove("hidden");
    modal.classList.add("flex");

    if(index!==null){

        document.getElementById("modalTitle").innerText="Editar Julieta";

        document.getElementById("editIndex").value=index;

        document.getElementById("columnNumber").value=
            vehicles[index].column;

        document.getElementById("vehicleName").value=
            vehicles[index].name;

        document.getElementById("revisionDate").value=
            vehicles[index].date;

        document.getElementById("status").value=
            vehicles[index].status || "ok";

    }else{

        document.getElementById("modalTitle").innerText="Nova Julieta";

        document.getElementById("vehicleForm").reset();

        document.getElementById("editIndex").value="";

    }

}


function closeModal(){

    const modal=document.getElementById("modal");

    modal.classList.remove("flex");
    modal.classList.add("hidden");

}


/* =========================================================
   FORMULÁRIO
========================================================= */

document.getElementById("vehicleForm").onsubmit=function(e){

    e.preventDefault();

    const index=document.getElementById("editIndex").value;

    const data={

        column:Number(
            document.getElementById("columnNumber").value
        ),

        name:
            document.getElementById("vehicleName").value.trim(),

        date:
            document.getElementById("revisionDate").value,

        status:
            document.getElementById("status").value

    };

    if(index===""){

        vehicles.push(data);

    }else{

        vehicles[index]=data;

    }

    saveToStorage();

    closeModal();

};


/* =========================================================
   EXCLUIR
========================================================= */

function deleteVehicle(index){

    if(confirm("Excluir esta Julieta?")){

        vehicles.splice(index,1);

        saveToStorage();

    }

}


/* =========================================================
   DATAS
========================================================= */

function formatDate(date){

    if(!date) return "-";

    const p=date.split("-");

    if(p.length!==3) return date;

    return `${p[2]}/${p[1]}/${p[0]}`;

}


function getDaysPassed(date){

    if(!date) return null;

    const p=date.split("-");

    if(p.length!==3) return null;

    const dataPassou=new Date(
        Number(p[0]),
        Number(p[1])-1,
        Number(p[2])
    );

    dataPassou.setHours(0,0,0,0);

    const hoje=new Date();

    hoje.setHours(0,0,0,0);

    return Math.floor(
        (hoje-dataPassou)/(1000*60*60*24)
    );

}


/* =========================================================
   STATUS AUTOMÁTICO
========================================================= */

function getStatusAutomatico(date){

    const dias=getDaysPassed(date);

    if(dias===null)
        return "ok";

    /* MAIS DE 10 DIAS = ATRASADA */
    if(dias>10)
        return "danger";

    /* 8, 9 OU 10 DIAS = ATENÇÃO */
    if(dias>=8)
        return "warning";

    /* 0 ATÉ 7 DIAS = EM DIA */
    return "ok";

}


function statusText(status){

    if(status==="warning")
        return "ATENÇÃO";

    if(status==="danger")
        return "ATRASADO";

    return "EM DIA";

}


/* =========================================================
   FILTRO
========================================================= */

function setStatusFilter(status){

    statusFilter=status;

    document.querySelectorAll(".status-filter")
    .forEach(button=>{

        button.classList.remove(
            "bg-blue-600",
            "text-white"
        );

        button.classList.add(
            "bg-white",
            "text-slate-600",
            "border"
        );

    });

    const ativo=document.getElementById("filter-"+status);

    ativo.classList.remove(
        "bg-white",
        "text-slate-600",
        "border"
    );

    ativo.classList.add(
        "bg-blue-600",
        "text-white"
    );

    renderTable();

}


/* =========================================================
   RENDERIZAÇÃO
========================================================= */

            !coluna.includes(search)
        ) return;

/* =========================================================
   BACKUP
========================================================= */

function exportData(){

    const blob=new Blob(
        [JSON.stringify(vehicles,null,2)],
        {type:"application/json"}
    );

    const url=URL.createObjectURL(blob);

    const a=document.createElement("a");

    a.href=url;
    a.download="julieta_backup.json";

    document.body.appendChild(a);

    a.click();

    document.body.removeChild(a);

    URL.revokeObjectURL(url);

}


/* =========================================================
   LIMPAR
========================================================= */

function clearAllData(){

    if(confirm("Apagar todas as Julietas?")){

        vehicles=[];

        saveToStorage();

    }

}


/* =========================================================
   INÍCIO
========================================================= */

window.onload=()=>{
